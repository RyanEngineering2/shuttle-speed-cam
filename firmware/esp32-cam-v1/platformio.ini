; v1 (retired): the whole speed camera on an AI-Thinker ESP32-CAM with its OV2640.
; Kept for reference; see README.md in this folder for why it was replaced.

[env:esp32cam]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
