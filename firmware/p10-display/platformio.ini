; P10 display node: an ESP32 DevKit that drives HUB12 P10 LED panels and shows
; whatever speed the Raspberry Pi sends it over UART.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/Qudor-Engineer/DMD32.git
build_flags =
    ; Number of 32x16 P10 panels side by side. 2 shows "km/h" and the best speed.
    -DPANELS_ACROSS=2
